workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # هنا خلينا التوقيع اليدوي فقط ومسحنا الأوتوماتيك
      ios_signing:
        provisioning_profiles:
          - Syriazzle_Manual_Profile
        certificates:
          - ios_certificate.p12

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project
        script: |
          flutter build ios --config-only
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
